; Firmware reTerminal E1001 — affichage d'occupation des salles
; Compilation : pio run      Flash : pio run -t upload      Logs : pio device monitor

[platformio]
default_envs = reterminal_e1001

[env:reterminal_e1001]
platform = espressif32 @ ^6.9.0
board = seeed_xiao_esp32s3            ; le E1001 embarque un ESP32-S3 + 8 Mo PSRAM OPI
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv   ; 2 partitions app => OTA possible
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    zinggjm/GxEPD2 @ ^1.6.4
    adafruit/Adafruit GFX Library @ ^1.12.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
; La version (FW_VERSION) et la configuration réseau sont injectées par
; include/config_local.h, généré par le conteneur de build depuis le fichier .env.
